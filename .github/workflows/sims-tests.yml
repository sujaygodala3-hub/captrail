name: sims tests
on:
  push:
    paths: ["sims/**", ".github/workflows/sims-tests.yml"]
  pull_request:
    paths: ["sims/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sims
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sims/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Committed datasets match their manifests, schema, splits and privacy rules
        run: |
          shopt -s nullglob
          for d in datasets/captrail-v*/; do python export_dataset.py --check "$d"; done
