name: Test trained model frontend bridge
on:
  push:
    branches: ['feature/trained-captrail-ai-integration']
    paths:
      - 'api/ml-bridge.js'
      - 'ml-analysis.js'
      - 'scan.html'
      - 'tests/ml-bridge.test.mjs'
      - '.github/workflows/trained-ml-integration.yml'
  pull_request:
    paths:
      - 'api/ml-bridge.js'
      - 'ml-analysis.js'
      - 'scan.html'
      - 'tests/ml-bridge.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/ml-bridge.js && node --check ml-analysis.js
      - run: node --test tests/ml-bridge.test.mjs
