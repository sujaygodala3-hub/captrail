name: Trained ML frontend contracts
on:
  push:
    branches: [feature/trained-captrail-ai-integration, feature/research-workstation-v6]
  pull_request:
    paths: ['api/**', 'research/**', 'capture-core.js', 'ml-analysis.js', 'scan.html', 'tests/**', 'scripts/**', 'package*.json']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci && npm run check && npm test
      - run: npm audit --omit=dev --audit-level=high
